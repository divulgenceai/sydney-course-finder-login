name: Refresh daily Wordle challenge

on:
  schedule:
    # Sydney midnight is 13:00 or 14:00 UTC, depending on daylight saving.
    - cron: '7 13,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-wordle.mjs
      - name: Publish changed challenge
        run: |
          if git diff --quiet -- wordle.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wordle.json
          git commit -m "Update daily Wordle challenge"
          git push
